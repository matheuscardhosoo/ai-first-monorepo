name: Agentic CI Healer

on:
  workflow_run:
    workflows: ["AI PR Governance & Reviewer", "Build & Test"]
    types: [completed]

jobs:
  investigate-and-heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Failed CI Logs
        uses: actions/download-artifact@v4
        with:
          name: ci-logs
        continue-on-error: true

      - name: Run AI Agent (Skill 06 - Maintenance & RCA)
        # Invokes the project's configured agent runner (e.g., Claude Code, Gemini Antigravity, Copilot CLI)
        run: |
          echo "Triggering Skill 06: Maintenance, Debugging & Observability..."
          echo "Investigating failure in Run #${{ github.event.workflow_run.id }}"
          # The agent must:
          # 1. Inspect failed log trace
          # 2. Write a failing reproduction test
          # 3. Apply the minimal architectural fix
          # 4. Generate docs/rca/INC-[id].md from .ai/templates/04-bug-rca.md
          # 5. Append systemic learnings to docs/knowledge/lessons-learned.md

      - name: Create Self-Healing Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "🤖 Auto-Heal: Fix CI Failure from Run #${{ github.event.workflow_run.id }}"
          body: |
            This PR was automatically generated by the Agentic CI Healer (Skill 06).
            
            ### Included Changes
            1. Failing reproduction test
            2. Minimal verified code fix
            3. Root Cause Analysis (`docs/rca/INC-${{ github.event.workflow_run.id }}.md`)
            4. Knowledge base update (`docs/knowledge/lessons-learned.md`)
            
            *Please review the RCA and test results before approving.*
          labels: "ai-generated, requires-human-approval"
